name: Publish ioBroker.gira-endpoint

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 24 + npm registry
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          always-auth: true

      # package-lock.json is currently older than package.json.
      # npm install keeps releases unblocked until the lockfile is regenerated and committed.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build --if-present

      - name: Test
        run: npm run test --if-present

      - name: Sanity check
        run: npm pack --dry-run

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
